<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Siw Touristhouse - Home</title>
    <link rel="stylesheet" href="/css/stile.css" />
    <link rel="stylesheet" href="/css/home.css" />
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main>
    <h1 th:text="'Benvenuti al ' + ${struttura.nome}">Benvenuti al Siw Touristhouse</h1>
    <p class="slogan">Scopri le nostre camere e prenota il tuo soggiorno.</p>

    <div class="galleria-home" th:if="${not #lists.isEmpty(fotoHome)}">
        <img th:each="f, iter : ${fotoHome}" th:src="@{${f}}" th:alt="${struttura.nome}"
             th:classappend="${iter.index == 0 ? 'foto-grande' : ''}" />
    </div>

    <div class="camera-card">
        <h2>Informazioni sulla struttura</h2>
        <p th:text="${struttura.descrizione}"></p>

        <ul class="camera-info">
            <li><strong>Indirizzo:</strong> <span th:text="${struttura.indirizzo}"></span></li>
            <li><strong>Check-in:</strong> <span th:text="${struttura.orarioCheckInInizio}"></span></li>
            <li><strong>Check-out:</strong> <span th:text="${struttura.orarioCheckOut}"></span></li>
            <li><strong>Politica di cancellazione:</strong> <span th:text="${struttura.politicaCancellazione}"></span></li>
        </ul>

        <p><strong>Servizi:</strong></p>
        <ul class="camera-info">
            <li th:each="servizio : ${struttura.serviziStruttura}" th:text="${servizio}"></li>
        </ul>
    </div>

    <p>
        <a th:href="@{/camere}" class="btn btn-large">Vedi tutte le camere</a>
        <a th:href="@{/prenotazioni/nuovaprenotazione}" class="btn btn-large">nuova prenotazione</a>
    </p>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
