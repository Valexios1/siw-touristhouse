<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${'Modifica Regola Prezzo #' + regolaPrezzo.id}">Modifica Regola Prezzo</title>
    <link rel="stylesheet" href="/css/stile.css" />
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main>
    <a th:href="@{/admin/regolaPrezzo/{id}(id=${regolaPrezzo.id})}" class="btn-back">&larr; Torna al dettaglio</a>

    <h1>Modifica Regola Prezzo</h1>

    <form th:action="@{/admin/regolaPrezzo/{id}/modifica(id=${regolaPrezzo.id})}"
          th:object="${regolaPrezzo}" method="post" class="form-camera">

        <div class="error-msg" th:if="${#fields.hasGlobalErrors()}">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
        </div>

        <div class="form-group">
            <label for="nome">Nome</label>
            <input type="text" id="nome" th:field="*{nome}" required />
            <span class="error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
        </div>

        <div class="form-group">
            <label for="dataInizio">Data inizio</label>
            <input type="date" id="dataInizio" th:field="*{dataInizio}" required />
            <span class="error" th:if="${#fields.hasErrors('dataInizio')}" th:errors="*{dataInizio}"></span>
        </div>

        <div class="form-group">
            <label for="dataFine">Data fine</label>
            <input type="date" id="dataFine" th:field="*{dataFine}" required />
            <span class="error" th:if="${#fields.hasErrors('dataFine')}" th:errors="*{dataFine}"></span>
        </div>

        <div class="form-group">
            <label for="variazionePrezzo">Variazione prezzo (%)</label>
            <input type="number" id="variazionePrezzo" th:field="*{variazionePrezzo}" placeholder="es. 20, -10" required />
            <span class="error" th:if="${#fields.hasErrors('variazionePrezzo')}" th:errors="*{variazionePrezzo}"></span>
        </div>

        <div class="form-group">
            <label for="minimoNottiSoggiorno">Minimo notti soggiorno</label>
            <input type="number" id="minimoNottiSoggiorno" th:field="*{minimoNottiSoggiorno}" min="1" required />
            <span class="error" th:if="${#fields.hasErrors('minimoNottiSoggiorno')}" th:errors="*{minimoNottiSoggiorno}"></span>
        </div>

        <button type="submit" class="btn">Salva modifiche</button>
    </form>
</main>

<footer>
    <p>&copy; 2026 Siw Touristhouse</p>
</footer>
</body>
</html>
