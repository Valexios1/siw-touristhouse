<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Le Nostre Camere</title>
    <link rel="stylesheet" href="/css/stile.css" />
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main>
    <h1>Le Nostre Camere</h1>

    <div th:if="${successo != null}" class="success-msg" th:text="${successo}"></div>
    <div th:if="${errore != null}" class="error-msg" th:text="${errore}"></div>

    <div id="camere-widget"></div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="/js/camere-widget.js"></script>
</body>
</html>
