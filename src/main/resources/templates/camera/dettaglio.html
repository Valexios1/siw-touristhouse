<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="'Camera ' + ${camera.numeroCamera}">Dettaglio Camera</title>
    <link rel="stylesheet" href="/css/stile.css" />
    <link rel="stylesheet" href="/css/camere.css" />
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main>
    <a th:href="@{/camere}" class="btn-back">&larr; Torna alle camere</a>

    <div th:if="${successo != null}" class="success-msg" th:text="${successo}"></div>
    <div th:if="${errore != null}" class="error-msg" th:text="${errore}"></div>

    <div class="camera-dettaglio">
        <h1 th:text="'Camera ' + ${camera.numeroCamera}"></h1>

        <th:block th:if="${isAdmin}">
            <a th:href="@{/admin/camera/{id}/regole(id=${camera.id})}" class="btn">Gestisci regole prezzo</a>
            <form th:action="@{/admin/camera/{id}/elimina(id=${camera.id})}" method="post" class="inline-form"
                  onsubmit="return confirm('Eliminare questa camera?');">
                <button type="submit" class="btn btn-danger">Elimina camera</button>
            </form>
        </th:block>

        <div class="dettaglio-info">
            <div class="dettaglio-blocco">
                <h3>Caratteristiche</h3>
                <ul>
                    <li><strong>Tipologia:</strong> <span th:text="${camera.tipologia}"></span></li>
                    <li><strong>Capienza massima:</strong> <span th:text="${camera.capienzaMassima}"></span> ospiti</li>
                    <li><strong>Superficie:</strong> <span th:text="${camera.superficieMq}"></span> mq</li>
                    <li><strong>Stato:</strong> <span th:text="${camera.statoAttuale}"></span></li>
                </ul>
            </div>

            <div class="dettaglio-blocco">
                <h3>Prezzo</h3>
                <p class="prezzo" th:text="${camera.prezzoBaseNotte} + ' &euro;/notte'"></p>
            </div>

            <div class="dettaglio-blocco">
                <h3>Recensioni</h3>
                <p th:if="${mediaVoto != null}">
                    <strong>Media voti:</strong>
                    <span th:text="${#numbers.formatDecimal(mediaVoto, 1, 1)}"></span> / 5
                </p>
                <p th:if="${mediaVoto == null}">Nessuna recensione per questa camera.</p>
            </div>

            <div class="dettaglio-blocco" th:if="${isAdmin}">
                <h3>Regole prezzo associate</h3>
                <p th:if="${camera.regolePrezzo == null or #lists.isEmpty(camera.regolePrezzo)}">Nessuna regola associata.</p>
                <ul>
                    <li th:each="r : ${camera.regolePrezzo}">
                        <a th:href="@{/admin/regolaPrezzo/{id}(id=${r.id})}"
                           th:text="${r.nome + ' (' + r.variazionePrezzo + ')'}"></a>
                    </li>
                </ul>
            </div>

        </div>

        <section class="camera-foto-sezione">
            <h3>Foto</h3>
            <p th:if="${#lists.isEmpty(foto)}">Nessuna foto disponibile.</p>
            <div class="galleria-foto" th:if="${not #lists.isEmpty(foto)}">
                <a th:each="f : ${foto}" th:href="@{${f}}" target="_blank">
                    <img th:src="@{${f}}" th:alt="${'Foto camera ' + camera.numeroCamera}" />
                </a>
            </div>
        </section>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
