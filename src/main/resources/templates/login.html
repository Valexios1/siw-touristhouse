<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <link rel="stylesheet" href="/css/stile.css" />
</head>
<body>
<header>
    <div class="logo">
        <a th:href="@{/}"><img src="/images/logo.jpg" alt="Logo" /></a>
    </div>
    <nav>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/camere}">Camere</a>
    </nav>
</header>

<main>
    <h1>Accedi</h1>

    <div th:if="${param.error}" class="error-msg">
        Username o password non validi.
    </div>

    <div th:if="${param.logout}" class="success-msg">
        Logout effettuato con successo.
    </div>

    <form th:action="@{/login}" method="post" class="form-camera">

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autofocus />
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required />
        </div>

        <button type="submit" class="btn">Login</button>
    </form>

    <p>Non hai un account? <a th:href="@{/register}">Registrati</a></p>
</main>

<footer>
    <p>&copy; 2026 Siw Touristhouse</p>
</footer>
</body>
</html>
