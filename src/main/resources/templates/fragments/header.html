<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header">
    <div class="logo">
        <a class="brand-name" th:href="@{/}" th:text="${struttura != null ? struttura.nome : 'Siw Touristhouse'}"></a>
    </div>
    <nav>
        <a th:href="@{/camere}">Camere</a>
        <a th:href="@{/prenotazioni}">Prenotazioni</a>
        <a th:if="${isAdmin}" th:href="@{/admin}">Pannello Admin</a>
        <a th:if="${userDetails != null}" th:href="@{/area-personale}">Area personale</a>

        <th:block th:if="${userDetails != null}">
            <span class="user-name" th:text="${userDetails.username}"></span>
            <form th:action="@{/logout}" method="post" class="logout-form">
                <button type="submit" class="logout-btn">Logout</button>
            </form>
        </th:block>

        <th:block th:unless="${userDetails != null}">
            <a th:href="@{/login}">Login</a>
            <a th:href="@{/register}">Registrati</a>
        </th:block>
    </nav>
</header>
</body>
</html>
