<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="'Prenotazione ' + ${prenotazione.codicePrenotazione}">Dettaglio Prenotazione</title>
    <link rel="stylesheet" href="/css/stile.css" />
</head>
<body>
<header>
    <div class="logo">
        <a th:href="@{/}"><img src="/images/logo.jpg" alt="Logo" /></a>
    </div>
    <nav>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/camere}">Camere</a>
    </nav>
</header>

<main>
    <a th:href="@{/prenotazioni}" class="btn-back">&larr; Torna alle prenotazioni</a>

    <div class="camera-dettaglio">
        <h1 th:text="'Prenotazione ' + ${prenotazione.codicePrenotazione}"></h1>

        <p class="stato">Stato: <strong th:text="${prenotazione.stato}"></strong></p>

        <div class="dettaglio-info">
            <div class="dettaglio-blocco">
                <h3>Soggiorno</h3>
                <ul>
                    <li><strong>Check-in:</strong> <span th:text="${#temporals.format(prenotazione.dataCheckIn, 'dd/MM/yyyy')}"></span></li>
                    <li><strong>Check-out:</strong> <span th:text="${#temporals.format(prenotazione.dataCheckOut, 'dd/MM/yyyy')}"></span></li>
                    <li><strong>Adulti:</strong> <span th:text="${prenotazione.numeroAdulti}"></span></li>
                    <li><strong>Bambini:</strong> <span th:text="${prenotazione.numeroBambini}"></span></li>
                </ul>
            </div>

            <div class="dettaglio-blocco">
                <h3>Camera</h3>
                <ul>
                    <li><strong>Numero:</strong> <span th:text="${prenotazione.camera.numeroCamera}"></span></li>
                    <li><strong>Tipologia:</strong> <span th:text="${prenotazione.camera.tipologia}"></span></li>
                    <li><strong>Capienza:</strong> <span th:text="${prenotazione.camera.capienzaMassima}"></span> ospiti</li>
                </ul>
                <a th:href="@{/camere/{id}(id=${prenotazione.camera.id})}" class="btn">Vedi camera</a>
            </div>

            <div class="dettaglio-blocco">
                <h3>Cliente</h3>
                <ul>
                    <li><strong>Nome:</strong> <span th:text="${prenotazione.utente.name + ' ' + prenotazione.utente.surname}"></span></li>
                    <li><strong>Email:</strong> <span th:text="${prenotazione.utente.email}"></span></li>
                    <li><strong>Telefono:</strong> <span th:text="${prenotazione.utente.phoneNumber}"></span></li>
                </ul>
            </div>

            <div class="dettaglio-blocco">
                <h3>Totale</h3>
                <p class="prezzo" th:text="${prenotazione.prezzoTotale} + ' &euro;'"></p>
                <p><strong>Creata il:</strong> <span th:text="${#temporals.format(prenotazione.dataCreazione, 'dd/MM/yyyy HH:mm')}"></span></p>
            </div>
        </div>

        <div class="dettaglio-blocco" th:if="${prenotazione.noteCliente != null and !prenotazione.noteCliente.isEmpty()}">
            <h3>Note del cliente</h3>
            <p th:text="${prenotazione.noteCliente}"></p>
        </div>
    </div>
</main>

<footer>
    <p>&copy; 2026 Siw Touristhouse</p>
</footer>
</body>
</html>
