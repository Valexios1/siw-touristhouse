<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Area Personale</title>
    <link rel="stylesheet" href="/css/stile.css" />
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main>
    <h1>Area Personale</h1>

    <div th:if="${utente != null}" class="success-msg">
        Benvenuto, <span th:text="${utente.name + ' ' + utente.surname}"></span>.
    </div>

    <a th:if="${isAdmin}" th:href="@{/admin}" class="btn-back">&larr; Torna al pannello admin</a>

    <p>
        <a th:href="@{/prenotazioni/nuovaprenotazione}" class="btn">Nuova prenotazione</a>
        <a th:href="@{/camere}" class="btn">Vedi le camere</a>
    </p>

    <h2>Le tue prenotazioni</h2>

    <p th:if="${#lists.isEmpty(prenotazioni)}">Non hai ancora effettuato prenotazioni.</p>

    <div class="camere-grid">
        <div th:each="p : ${prenotazioni}" class="camera-card">
            <h2 th:text="${'Prenotazione #' + p.id}"></h2>
            <ul class="camera-info">
                <li><strong>Camera:</strong>
                    <span th:text="${p.camera != null ? 'Camera ' + p.camera.numeroCamera : 'n/d'}"></span>
                </li>
                <li><strong>Check-in:</strong>
                    <span th:text="${p.dataCheckIn != null ? #temporals.format(p.dataCheckIn, 'dd/MM/yyyy') : 'n/d'}"></span>
                </li>
                <li><strong>Check-out:</strong>
                    <span th:text="${p.dataCheckOut != null ? #temporals.format(p.dataCheckOut, 'dd/MM/yyyy') : 'n/d'}"></span>
                </li>
                <li><strong>Ospiti:</strong>
                    <span th:text="${p.numeroAdulti}"></span> adulti,
                    <span th:text="${p.numeroBambini}"></span> bambini
                </li>
                <li><strong>Stato:</strong>
                    <span th:text="${p.stato != null ? p.stato : 'n/d'}"></span>
                </li>
                <li th:if="${p.prezzoTotale != null}">
                    <strong>Totale:</strong> <span th:text="${p.prezzoTotale} + ' €'"></span>
                </li>
            </ul>
            <a th:href="@{/prenotazioni/{id}(id=${p.id})}" class="btn">Dettaglio</a>
        </div>
    </div>
</main>

<footer>
    <p>&copy; 2026 Siw Touristhouse</p>
</footer>
</body>
</html>
